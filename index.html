<script type="text/plain" id="raw-qa">
Q:「どうぞお入りください。まずはあなたの自己PRをお願いします。」
「失礼いたします！〇〇と申します！本日はよろしくお願いします！」|声が元気すぎてオフィスの観葉植物がストレスを感じたため。
「し、失礼します…〇〇です…よろしくお願いします…」|声の周波数が弊社のWi-Fiと干渉し通信速度が低下したため。
無言で深々と90度のお辞儀をする|お辞儀の角度が89.2度であり弊社規定の90.0度に達していなかったため。
「私の強みは誰とでもすぐ打ち解けられるコミュ力です！」|距離感が近すぎて社内のパーソナルスペース条例に違反するため。
「どんな理不尽な業務でも笑顔で耐え抜きます！」|耐え抜かれるとこちらの理不尽のやりがいがなくなるため。
「前職では営業成績3年連続トップでした！」|優秀すぎて既存社員のプライドを傷つけるため。
「未経験ですが一から素直に学ぶ意欲があります！」|教えるコストがかかるため生まれた瞬間から業務できる人材を求めているため。
「笑顔と元気だけは誰にも負けません！」|歯が白すぎて面接官の目が眩んだため。
「御社に骨を埋める覚悟で参りました！」|オフィス内に骨を埋めるスペースが建築基準法上確保できないため。
「私を雇わないと御社は絶対に損をします！」|その根拠を数値データと円グラフで提出していないため。

Q:「あなたが弊社を志望した一番の理由を教えてください。」
「御社の企業理念に深く共感したからです！」|共感性が高すぎて将来的に社長の座を奪う危険性があるため。
「正直に申しますと、お給料と福利厚生に惹かれました」|正直すぎる人間は弊社のブラックな社風に適応できないため。
「御社が第一志望です！他社は一社も受けていません！」|リスク分散ができておらず投資家としての資質に欠けるため。
「御社の製品を毎日愛用しているからです！」|愛用しているなら消費者のままでいてくれた方が売上に貢献できるため。
「社長の著書を読んで感銘を受けました！」|社長は本を一冊も出版していないため嘘つきと判断されたため。
「テレビCMを見てカッコいいと思ったからです！」|弊社はテレビCMを一度も打ったことがないため。
「自宅から徒歩5分で通勤が楽だからです」|満員電車の苦しみを知らない人間は社会人と認められないため。
「競合他社と比べて御社が一番優れているからです」|他社を貶めるような発言をする人間は信用できないため。
「直感で『この会社だ！』とビビッときました」|静電気体質で会社のパソコンを壊しそうだから。
「御社の未来を一緒に創っていきたいからです！」|未来は自分で創るのでお前に手伝ってもらう必要はないため。

Q:「あなたの長所と短所を教えてください。」
「長所は几帳面なところ、短所は心配性なところです」|心配性すぎて明日地球が滅亡すると面接官まで不安にさせたため。
「長所は行動力、短所は少しせっかちなところです」|せっかちすぎて退職届も入社3日で出しそうだから。
「長所は協調性があるところ、短所は優柔不断なところです」|一人で何も決められない依存体質と判断されたため。
「長所は負けず嫌いなところ、短所は頑固なところです」|面接官とジャンケンをして勝ったら気まずくなるため。
「長所はポジティブ思考、短所は楽観的すぎるところです」|反省の色が全く見られない無責任な人間と判断されたため。
「長所は空気を読めること、短所は気を遣いすぎることです」|今、自分が落ちる空気を読めていないため。
「長所は記憶力が良いこと、短所は忘れっぽいことです」|発言が矛盾しており論理的思考力が破綻しているため。
「長所は集中力が高いこと、短所は周りが見えなくなることです」|火事が起きても気づかずに逃げ遅れそうだから。
「長所は誰にでも優しいこと、短所は怒れないことです」|詐欺師に騙されて会社の資金を振り込みそうだから。
「長所は完璧主義なところ、短所はありません！」|短所がない人間は人間味がなくロボットとみなされたため。

Q:「今朝、家を出る前に朝ごはんは何を食べましたか？」
「納豆ご飯と味噌汁を食べて気合を入れてきました！」|納豆のネバネバが粘り強さをアピールするあざとい演出に見えたため。
「トーストとコーヒーでスマートに済ませました」|米を食べない人間は日本経済の敵とみなされたため。
「朝食は抜いてハングリー精神を高めてきました！」|低血糖で業務中に倒れそうだから。
「昨日の残りのカレーを食べてきました！」|スパイスの匂いが会議室に充満し面接官が腹ペコになったため。
「プロテインとバナナだけです！」|筋肉アピールがうるさくてデスクワークに向いていなさそうだから。
「お母さんが作ってくれたおにぎりを食べました」|親離れができていないマザコンと判断されたため。
「コンビニの高級スイーツを食べてテンションを上げました」|朝から贅沢をする人間は金遣いが荒いと判断されたため。
「水しか飲んでいません！」|仙人みたいな生活をしていて飲み会のノリが悪そうだから。
「緊張しすぎて何を口にしたか覚えていません…」|数時間前の記憶すら飛ぶ人間には重要な仕事を任せられないため。
「質問の意図が分かりませんが、卵かけご飯です」|面接官に口答えする反抗的な態度が気に入らなかったため。

Q:「無人島に1つだけ持っていくとしたら何を持っていきますか？」
「サバイバルナイフを1本持っていきます！」|物騒すぎてコンプライアンス的にアウトなため。
「スマートフォンを持っていきます！」|電波が通じないことも想像できない情報弱者だから。
「御社の会社案内パンフレットを持っていきます！」|ゴマすりが露骨すぎて面接官が引いたため。
「ドラえもんのどこでもドアを持っていきます！」|現実とフィクションの区別がついていないため。
「火起こしセットを持っていきます！」|オフィスでも焚き火を始めそうな危険人物だから。
「大量の現金を持っていきます！」|無人島でお金が使えないことも分からない経済音痴だから。
「大好きな本を1冊持っていきます！」|優雅に読書している暇があるなら脱出方法を探せと思ったため。
「浄水器を持っていきます！」|堅実すぎて一緒に働いても面白みがなさそうだから。
「何も持っていかず、自分の肉体だけで生き抜きます！」|脳筋すぎてパソコン作業が務まらなそうだから。
「面接官様を連れていきます！」|勝手に道連れにされる迷惑千万な発言だったため。

Q:「あなたの趣味や休日の過ごし方を教えてください。」
「読書と映画鑑賞です！」|あまりにも無難すぎてAIが生成した履歴書と区別がつかないため。
「筋トレです！週5でジムに通っています！」|プロテインのシェイク音が業務の妨げになるため。
「家でずっとゲームをしています！」|インドアすぎて光合成が足りていないため。
「カフェ巡りをしてSNSに写真をアップしています！」|インスタ映えばかり気にして中身が伴っていないため。
「サウナで『ととのう』ことです！」|仕事中も意識が飛んで『ととのって』いそうだから。
「資格の勉強をしてスキルアップしています！」|休日まで勉強するなんて社畜の鏡すぎて逆に怖いから。
「寝だめをして体力を回復させています！」|冬眠するクマを採用する予定はないため。
「旅行で47都道府県すべて制覇しました！」|落ち着きがなくすぐ転勤や退職をしそうだから。
「人間観察が趣味です！」|面接官を観察して値踏みしている態度が気に入らないため。
「無趣味です。仕事だけを趣味にしたいです！」|ワークライフバランスを無視する時代錯誤な発言だったため。

Q:「自分を動物に例えると何だと思いますか？」
「チーターです！圧倒的なスピードで成果を出します！」|30秒でバテて持久力がなさそうだから。
「犬です！忠誠心があり誰とでも仲良くなれます！」|エサを与えれば他社にも尻尾を振りそうだから。
「猫です！マイペースに自分の世界を持っています！」|面接官が重度の猫アレルギーのため。
「ナマケモノです！」|そのままの意味で即不採用とさせていただきます。
「ライオンです！百獣の王としてチームを引っ張ります！」|社内の調和を乱す暴君になりそうだから。
「アリです！コツコツと地道な努力を続けます！」|視野が狭すぎて全体の戦略が見えていなさそうだから。
「フクロウです！夜型で冷静に物事を見極めます！」|朝寝坊して遅刻するのが目に見えているため。
「カメです！遅くても確実にゴールに辿り着きます！」|スピード感が求められるIT時代に全く合っていないため。
「カメレオンです！どんな環境にもすぐ適応できます！」|スパイの可能性があるため採用できません。
「人間です。私は動物ではありません！」|比喩表現が通じない融通の利かない堅物だから。

Q:「あなたの座右の銘は何ですか？」
「『継続は力なり』です！」|四字熟語が古臭くIT時代のスピード感に合わないため。
「『一期一会』です！」|今日で本当に最後の一会にして差し上げるため。
「『石の上にも三年』です！」|3年で辞めるつもりなのが透けて見えたため。
「『善は急げ』です！」|確認不足で誤送信や発注ミスを連発しそうだから。
「『急がば回れ』です！」|遠回りしすぎて一生ゴールに辿り着かなさそうだから。
「『七転び八起き』です！」|7回も転ぶような危なっかしい社員は雇えないため。
「『一石二鳥』です！」|二兎を追う者は一兎をも得ずという言葉を知らないため。
「『有言実行』です！」|ビッグマウスすぎて達成できなかったときの言い訳がうるさそうだから。

「宝くじを当てて早期リタイアしていたいです！」|働く気ゼロの人間を雇う理由がないため。

Q:「最後に、面接官の私に何か質問はありますか？」

「残業は月平均どれくらいでしょうか？」|時間を気にする人間は弊社に不要なため。
「有給休暇の取得率を伺ってもよろしいですか？」|休むことしか考えていないとみなされたため。
「御社の平均勤続年数は何年ですか？」|すぐ辞める前提で質問しているのが透けて見えたため。
「面接官様の休日の過ごし方を教えてください！」|プライベートに踏み込んでくるデリカシーのない人間だから。
「ぶっちゃけ、今の私の手応えは何点ですか？」|評価を急かすせっかちな態度が気に入らなかったため。
「御社の弱点は何だと思いますか？」|わざわざ嫌なことを聞いてくる性格の悪さが滲み出ていたため。
「内定をいただけたら初任給はいくらになりますか？」|お金のことしか頭にない守銭奴と判断されたため。
「この面接、どうやったら受かるんですか？」|メタ発言をする人間は世界観を壊すため。

Q:「学生時代、あるいは前職で最も力を入れて取り組んだことは何ですか？」
「アルバイトのリーダーとして売上を2倍にしました！」|リーダー経験者が多すぎて船頭多くして船山に登る状態になるため。

「部活動のキャプテンとして全国大会に出場しました！」|脳筋すぎてデスクワークでじっと座っていられなさそうだから。
「サークルを立ち上げて100人規模の組織にしました！」|勝手に派閥を作って社内の風紀を乱しそうだから。
「資格取得の勉強に励み、難関資格を5つ取りました！」|資格マニアで実務能力が伴っていないと判断されたため。
「海外留学に行き、異文化コミュニケーションを学びました！」|すぐ海外かぶれしてルー大柴みたいな喋り方になりそうだから。
「ボランティア活動で地域の清掃を毎週行っていました！」|偽善者っぽくて逆に信用できないため。
「SNSの運用に力を入れ、フォロワーを3万人増やしました！」|社内の機密情報までバズらせようとしてポストしそうだから。
「特にありません。毎日を平穏に過ごすことに全力を注ぎました！」|向上心がゼロすぎて植物と変わらないため。
「恋愛です！失恋から多くを学びました！」|ここは職場であって恋愛リアリティショーの会場ではないため。

Q:「これまでの人生で最大の挫折経験と、乗り越え方を教えてください。」

「前職で大きなミスをしましたが、仕組み化で再発を防ぎました！」|そもそもミスをする人間は信用できないため。
「起業に失敗して借金を背負いましたが、完済しました！」|金銭感覚が狂っていて会社の経費を使い込みそうだから。
「人間関係で悩みましたが、相手と本音で話し合って解決しました！」|面倒くさい人間ドラマを社内に持ち込みそうだから。
「ダイエットに10回失敗しましたが、今も挑戦中です！」|まだ乗り越えていないのにドヤ顔で語らないでほしいため。
「推しのアイドルが卒業したことですが、新しい推しを見つけました！」|切り替えが早すぎて会社への忠誠心もすぐなくなりそうだから。
「人生で一度も挫折したことがありません！すべて順風満帆です！」|打たれ弱く、一度つまずいたら再起不能になりそうだから。
「今この瞬間、御社に落とされそうなことが最大の挫折です！」|予知能力があるならもっと別の仕事に就いた方が良いため。
「辛すぎて思い出したくないのでノーコメントでお願いします！」|ストレス耐性がゼロすぎて入社初日にバックレそうだから。

Q:「なぜ他社ではなく、弊社でなければならないのですか？」
「御社にしかない独自の技術力に魅力を感じたからです！」|技術に頼りきりで自分の実力で勝負する気がないため。
「社員の方々の雰囲気が一番温かく働きやすそうだったからです！」|仲良しごっこをしに来るなら学校へ帰ってほしいため。
「業界トップのシェアを誇る御社で大きな仕事がしたいからです！」|大樹の陰に隠れようとする寄らば大樹の陰精神が気に入らないため。
「若手にもどんどん裁量権を与えてくれる社風に惹かれました！」|勝手に暴走して大損害を出す未来が見えたため。
「他社はすべて落ちてしまい、御社しか残っていないからです！」|負け犬の吹き溜まりにされたら弊社のブランドが傷つくため。
「御社の社名が一番カッコよかったからです！」|中身を見ずにパッケージだけで判断する浅はかな人間だから。
「面接官様のオーラに一目惚れしたからです！」|公私混同する危険人物とみなされたため。
「実は他社と迷っていますが、内定をくれた方に行きます！」|二股をかける不誠実な人間は採用できないため。
「御社のロゴマークの配色が私のラッキーカラーだからです！」|風水や占いで人生を決める非科学的な人間だから。
「正直、どこの会社でも良かったのですが一番近かったからです！」|あまりにも正直すぎて逆に清々しいが不採用です。

Q:「周りの人から、あなたはどのような人物だと言われますか？」
「『真面目で誠実な人』とよく言われます！」|真面目すぎて冗談が通じず飲み会で場が凍りそうだから。
「『明るくムードメーカー的存在』と言われます！」|うるさくて周囲の集中力を削ぎそうだから。
「『冷静沈着で頼りになる』と言われます！」|冷血漢すぎて部下が泣いてもフォローしなさそうだから。
「『マイペースで不思議ちゃん』と言われます！」|宇宙人と意思疎通するスキルを面接官は持っていないため。
「『怒ったところを見たことがない仏のような人』と言われます！」|溜め込んでいつか大爆発を起こす時限爆弾だから。
「『行動力がすごくてイノシシみたい』と言われます！」|オフィスの壁に激突して石膏ボードを破壊しそうだから。
「『気配り上手で母性（父性）がすごい』と言われます！」|おせっかいすぎて過保護な上司になりそうだから。
「『天才肌で何考えているか分からない』と言われます！」|自称天才ほど扱いづらい人材はいないため。
「『友達が一人もいないので誰にも言われません』」|コミュニケーション能力が絶望的に欠如しているため。
「『イケメン（美人）だね』としか言われません！」|ルッキズムを助長する発言はコンプライアンス違反なため。

Q:「最近気になったニュースと、それに対するあなたの意見を教えてください。」
「AIの急速な進化についてです。業務効率化に活かすべきだと思います！」|AIに仕事を奪われて自分の席がなくなる危機感がないため。
「円安と物価高についてです。賃上げが急務だと考えます！」|入社前から給料を上げろと要求してくる図々しさが無理なため。
「少子高齢化問題についてです。社会全体で支えるべきです！」|教科書通りの優等生コメントすぎて面白みがないため。
「環境問題とSDGsについてです。企業責任が問われています！」|意識が高すぎてエアコンの設定温度にいちいち文句を言いそうだから。
「大谷翔平選手の活躍です！同じ日本人として誇らしいです！」|他人の功績を自分のことのように語る他力本願な姿勢が不採用です。
「芸能人の不倫スキャンダルです！絶対に許せません！」|週刊誌のゴシップに熱中する暇があるなら仕事をしてほしいため。

「御社の株価が昨日少し下がっていたことが気になりました！」|傷口に塩を塗るようなデリカシーのない発言だったため。

Q:「ストレスを感じたとき、どのようにリフレッシュしますか？」
「ジムで思い切り汗を流してストレスを発散します！」|筋肉痛で翌日のタイピング速度が落ちそうだから。
「美味しいものをたくさん食べて寝ます！」|ストレスが溜まるたびに激太りして制服が破れそうだから。
「カラオケに行って大声で熱唱します！」|喉を潰して電話対応ができなくなるリスクがあるため。
「自然豊かな公園を散歩して心を落ち着かせます！」|営業の外回り中にそのまま公園でサボりそうだから。
「推しのライブに行って全力でペンライトを振ります！」|遠征のために有給休暇を頻繁に申請しそうだから。
「お風呂にゆっくり浸かってアロマを焚きます！」|意識が高すぎて一緒に働くと疲れそうだから。

Q:「チームで意見が対立したとき、あなたはどう行動しますか？」
「双方の意見をじっくり聞き、折衷案を提案します！」|八方美人で結局どっちつかずの中途半端な結論になりそうだから。
「データと事実に基づいて論理的に説得します！」|正論で相手を追い詰めて職場の空気を悪くしそうだから。
「自分の意見が正しいと信じて最後まで貫き通します！」|頑固すぎて組織の和を乱す独裁者タイプだから。
「波風を立てたくないので、すぐに相手の意見に合わせます！」|自分の意見がないイエスマンは不要なため。
「上司やリーダーに判断を仰ぎます！」|自分で考えることを放棄した責任転嫁タイプだから。
「ジャンケンやあみだくじで公平に決めます！」|会社の重要な意思決定を運任せにするギャンブラーだから。

「面倒なので対立している二人を放置して自分の仕事をします！」|協調性がゼロの個人主義者はチームに不要なため。
「腕相撲で勝った方の意見を採用します！」|暴力で解決しようとする原始人は採用できません。

Q:「仕事をする上で一番大切にしている価値観は何ですか？」
「スピード感です！誰よりも早く行動します！」|確認不足でケアレスミスを連発する未来が見えたため。
「正確性と丁寧さです！ミスをゼロにします！」|慎重すぎて納期に絶対に間に合わなさそうだから。
「お客様第一主義です！顧客満足度を追求します！」|顧客の無理難題をすべて引き受けて赤字を出しそうだから。
「チームワークです！仲間との絆を大切にします！」|馴れ合いばかりして馴れ合いサークルになりそうだから。
「自己成長です！常に新しいスキルを学びます！」|スキルを身につけたらすぐ転職して辞めそうだから。
「ワークライフバランスです！定時で帰ります！」|仕事が終わっていなくても帰りそうな雰囲気があるため。
「お金です！稼いだ分だけ評価してほしいです！」|守銭奴すぎて社内の雰囲気をギスギスさせそうだから。

「報連相です！小さなことでもすべて報告します！」|1分おきに報告してきて上司の仕事がストップするため。
「愛と平和です！世界を笑顔にしたいです！」|宗教の勧誘を始めそうで怖いから。

Q:「これまでに一番怒られた経験と、そこから学んだことを教えてください。」
「遅刻をして怒られ、それ以来1時間前行動を徹底しています！」|早すぎて警備員に不審者と間違えられるため不採用です。

Q:「自分を色に例えると何色ですか？理由も教えてください。」
「赤色です！誰にも負けない情熱を持っています！」|赤字決算を連想させる縁起の悪い発言だったため。
「青色です！常に冷静で論理的な判断ができます！」|顔色が悪そうで体調管理ができていなさそうだから。
「白色です！御社の社風に何色にも染まります！」|個性がない空っぽの人間と判断されたため。
「黒色です！何色にも染まらない強い信念があります！」|社風に合わせる気がない反逆者とみなされたため。
「黄色です！周りを明るく照らす太陽のような存在です！」|信号機なら『注意』の色なので危険人物と判断されたため。
「緑色です！癒やし系で周囲に安心感を与えます！」|存在感が薄すぎて観葉植物と間違えられそうだから。
「虹色です！多様なスキルと個性を持っています！」|欲張りすぎて結局何ができるのか分からないため。
「透明です！空気のように職場に溶け込みます！」|透明人間を採用してもデスクが空席に見えるため。
「金色です！圧倒的な輝きで売上トップを獲ります！」|成金趣味で品がないため弊社の品格に合いません。
「玉虫色です！見る角度によって意見を変えます！」|八方美人の嘘つきと自ら白状したようなものだから。

Q:「弊社のサービスや商品で改善すべき点があれば遠慮なく言ってください。」
「Webサイトが少し見づらいのでUIを改善すべきです！」|初対面でいきなりダメ出しをしてくる態度が偉そうだから。
「価格が少し高いので、もっと値下げすべきだと思います！」|利益率を無視した素人意見すぎて話にならないため。

「完璧すぎて改善すべき点は一つも見当たりません！」|ゴマすりばかりで建設的な意見が出せないイエスマンだから。
「正直、御社のサービスを使ったことがありません…」|企業研究すらしていないやる気ゼロの応募者だから。
「そもそもこの事業自体に将来性がないと思います！」|正論すぎて面接官の心が完全に折れたため。
「パッケージのデザインが昭和っぽくてダサいです！」|そのデザインを考えたのが目の前にいる面接官だから。

「改善点は入社してからお給料をいただいてお伝えします！」|情報の出し惜しみをするセコい人間だから。

Q:「あなたにとって『働くこと』とは何ですか？」
「社会に貢献し、誰かの役に立つことです！」|綺麗事すぎて聞いていて胃もたれしたため。
「生活するためのお金を稼ぐ手段です！」|ドライすぎて会社への愛着が一切湧かなそうだから。
「自分自身を成長させ、自己実現をする場です！」|会社を踏み台にして成長したらすぐ辞めそうだから。
「呼吸をすることと同じ、生きていく上で自然な営みです！」|面接中のあなたの呼吸音が少しうるさかったため。
「仲間と協力して大きな目標を達成する喜びです！」|部活動の延長気分で仕事に来られたら困るため。
「人生の修行であり、忍耐力を鍛える場です！」|勝手に滝に打たれて修行していてほしいため。

「鏡を見なくても、自分の完璧さは分かっているので見ません！」|根拠のない自信ほど危険なものはないため。

Q:「あなたの好きな言葉や、大切にしているモットーを教えてください。」
「『ありがとう』という言葉を一番大切にしています！」|小学生の道徳の授業レベルで語彙力が低すぎるため。
「『なんとかなる』をモットーに、前向きに生きています！」|無計画すぎて仕事でもなんとかなる精神でサボりそうだから。
「『塵も積もれば山となる』です！日々の努力を大切にしています！」|ことわざが古臭くてスピード感がないため。
「『実るほど頭を垂れる稲穂かな』です！謙虚さを忘れません！」|謙虚すぎてアピールポイントが伝わってこないため。
「『時は金なり』です！1秒も無駄にせず効率よく働きます！」|セカセカしていて周囲を急かしそうだから。
「『笑う門には福来る』です！いつも笑顔で過ごします！」|怒られているときも笑って火に油を注ぎそうだから。
「『棚からぼたもち』です！ラッキーを待つのが好きです！」|他力本願すぎて自分で努力する気がないため。
「『弱肉強食』です！強い者が生き残る世界が好きです！」|社内の和を乱す危険な肉食系人間だから。
「『定時退社』という四字熟語が一番好きです！」|正直すぎるが採用する理由が1ミリもなくなったため。
「モットーに縛られるのが嫌いなので、特にありません！」|芯がないフラフラした人間と判断されたため。

Q:「仕事とプライベート、どちらを優先しますか？」
「バランスを大切にし、どちらも全力で充実させます！」|一番無難で面白みが1ミリもない回答だったため。
「今は仕事が一番大切なので、プライベートを犠牲にしてでも働きます！」|労働基準法違反を誘発する危険な社畜予備軍だから。
「プライベートを優先します！そのために仕事を頑張るので！」|急な残業やトラブル対応をすべて断りそうだから。
「状況によります。繁忙期は仕事、それ以外はプライベートです！」|優等生すぎて逆に胡散臭いから。
「仕事が趣味なので、仕事とプライベートの境界線がありません！」|ワークライフバランスを無視する時代錯誤な人間だから。
「プライベートが充実していないと、良い仕事はできないと思います！」|恋人と別れたら仕事もサボりそうだから。
「お給料がたくさんもらえるなら、どちらでも構いません！」|現金すぎて人間味が1ミリも感じられないため。
「そもそもプライベートで遊ぶ友達がいないので、仕事しかありません！」|悲しすぎて面接官が気まずくなったため不採用です。
「仕事中にプライベートの予定を考えるのが一番楽しいです！」|業務中にサボる宣言をされたため即不採用です。
「その質問自体がコンプライアンス違反ではないですか？」|面接官に噛みついてくる生意気な態度が許せないため。

Q:「これまでの人生で、一番お金を使ったことは何ですか？」
「大学の学費や資格取得など、自分の教育とスキルアップです！」|模範解答すぎて面白みが1ミリもないため。
「海外旅行に行って、現地の文化や食事を満喫したことです！」|散財癖があって貯金がゼロになりそうだから。
「推し活（ライブ遠征やグッズ購入）に全財産をつぎ込みました！」|金銭感覚が崩壊しているとみなされたため。
「最新のパソコンやガジェットを揃えて作業環境を整えたことです！」|形から入るタイプで中身が伴っていないため。
「両親への感謝を込めて、高級レストランで食事を奢ったことです！」|いい人アピールがあざとくて逆に信用できないため。
「ソーシャルゲームのガチャに課金して気づいたら数十万円使っていました！」|ギャンブル依存症の素質があるため採用できません。
「一人暮らしを始める際の引っ越し費用と家具代です！」|普通すぎてエピソードとして弱すぎるため。
「貯金が趣味なので、これまで大きなお金を使ったことがありません！」|お金を使わない人間は経済を回していないため。
「友人の結婚式のご祝儀貧乏で、毎月大赤字でした！」|見栄っ張りで計画性がない人間と判断されたため。
「今日の面接に来るための交通費が一番の出費です！」|せこすぎて交通費の領収書を10円単位で請求してきそうだから。

Q:「もしあなたが弊社の社長になったら、最初に何をしますか？」
「社員の給料を全員2倍にして、モチベーションを上げます！」|人件費が膨らんで3ヶ月で会社が倒産するため。
「理不尽な面接制度を廃止して、誰でも内定が出るようにします！」|今の面接官の仕事を全否定する発言だったため。
「業務の無駄を徹底的に省き、残業ゼロのホワイト企業にします！」|綺麗事ばかりで売上が下がる未来が見えたため。
「新規事業に全額投資して、業界ナンバーワンを目指します！」|ギャンブル経営で会社を潰す危険人物だから。
「社長室を豪華にリフォームして、毎日マッサージを受けます！」|私利私欲に走る暴君になることが確定しているため。
「社員全員でハワイへ社員旅行に行って親睦を深めます！」|公私混同して会社の経費を遊びに使いそうだから。
「まずは現場の社員一人ひとりと面談して、声を聞きます！」|優等生すぎて面白みが1ミリもないため。
「会社を売却して、そのお金で南の島に移住します！」|会社を乗っ取って売り飛ばす気満々で怖いから。
「私には社長の器がないので、すぐに辞任して平社員に戻ります！」|責任感がゼロの逃げ腰人間だから。
「今すぐこの場で、面接官様をクビにします！」|宣戦布告をしてくる物騒な人間は採用できません。

Q:「周囲の人から、よくどんな相談を受けますか？」
「恋愛相談が一番多いです！人の話を聞くのが好きなので！」|社内恋愛のキューピッドになって風紀を乱しそうだから。
「進路や仕事の悩みなど、真面目な相談をよく受けます！」|説教臭くて偉そうなアドバイスをしそうだから。
「人間関係のトラブルについて相談されることが多いです！」|トラブルに首を突っ込んで自分も巻き込まれそうだから。
「パソコンやスマホの使い方など、機械の相談をよく受けます！」|ITサポート係としてこき使われて本業が疎かになりそうだから。
「ファッションや髪型など、センスに関する相談を受けます！」|チャラチャラしていて真面目に働かなさそうだから。
「お金の貸し借りに関する相談をよく受けます…」|怪しい人間関係を持っている危険人物とみなされたため。
「相談を受けることは全くなく、いつも私が相談してばかりです！」|自立できていない依存体質と判断されたため。
「相談に乗るとつい正論で論破してしまうので、誰も相談してきません！」|デリカシーがゼロの冷血漢だから。
「人生相談から宇宙の真理まで、幅広く相談に乗っています！」|スピリチュアルすぎて会話が成立しないため。
「友人が一人もいないので、相談される相手がいません！」|コミュニケーション能力が絶望的に欠如しているため。

Q:「この面接の感想を正直に教えてください。」
「非常に有意義な時間で、御社への志望度がさらに高まりました！」|嘘くさいゴマすりが露骨すぎて面接官が引いたため。
「自分の考えを整理でき、とても勉強になりました！」|弊社を無料のリクルート練習場にするなと怒られたため。
「緊張しましたが、自分の思いはすべて伝えきれたと思います！」|一番無難で面白みが1ミリもない回答だったため。
「正直、質問が理不尽すぎて途中から笑いが止まりませんでした！」|面接官をバカにする失礼な態度が許せないため。
「圧迫面接かと思いましたが、意外と優しくて安心しました！」|上から目線の評価をする生意気な態度が気に入らないため。
「質問が多すぎて喉がカラカラなので、早くお水が飲みたいです！」|忍耐力がゼロの子供っぽい人間だから。
「手応えは100点満点です！内定通知を待っています！」|根拠のない自信ほど危険なものはないため。
「全く手応えがなく、もう落ちたと思って諦めています！」|ネガティブすぎて職場の空気を暗くしそうだから。
「面接官様のトークスキルが高くて、ファンになりました！」|お世辞が気持ち悪すぎて鳥肌が立ったため。
「感想は特にありません。早く帰って寝たいです！」|正直すぎて採用する理由が1ミリもなくなったため。

</script>

<script>
  var qaData = [];
  var currentItem = null;

  document.getElementById('raw-qa').textContent.split('\n').forEach(function(rawLine) {
    var line = rawLine.trim();
    if (!line) return;
    if (line.indexOf('Q:') === 0) {
      var qText = line.substring(2);
      var exists = qaData.some(function(item) { return item.q === qText; });
      if (!exists) {
        currentItem = { q: qText, a: [] };
        qaData.push(currentItem);
      } else {
        currentItem = null;
      }
    } else if (currentItem) {
      var pipePos = line.indexOf('|');
      if (pipePos !== -1) {
        currentItem.a.push({
          text: line.substring(0, pipePos),
          reason: line.substring(pipePos + 1)
        });
      }
    }
  });

  window.stages = [
    { step: "第1問 / 全3問", name: "第1問", boss: "一次面接官：佐藤", prob: 0.01, label: "1.0%" },
    { step: "第2問 / 全3問", name: "第2問", boss: "二次面接官：鈴木", prob: 0.001, label: "0.1%" },
    { step: "最終面接 / 全3問", name: "最終面接", boss: "代表取締役：黒幕", prob: 0.0005, label: "0.05%" }
  ];

  var cur = 0;
  var lastReason = "";
  var tries = Number(localStorage.getItem('kurogitsune_tries')) || 0;
  var wins = Number(localStorage.getItem('kurogitsune_wins')) || 0;
  var deck = [];

  // ページを開いた瞬間に前回の記録を画面に表示する
  document.getElementById('attempts').textContent = tries + " 回";
  document.getElementById('clears').textContent = wins + " 人";


  function getNextQuestion() {
    if (deck.length === 0) {
      deck = qaData.slice().sort(function() { return Math.random() - 0.5; });
    }
    return deck.pop();
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(function(el) {
      el.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
  }

     function updateShareLinks(win) {
    var st = window.stages.slice(cur, cur + 1).pop() || window.stages.slice(0, 1).pop();
    var gameUrl = "https://yoroz8.github.io/kurogitsune/";
    var txt = win
      ? "========================================\n【速報】確率0.00005%（200万分の1）の壁を突破し、『株式会社 黒狐』から伝説の内定を勝ち取りました！！（挑戦：" + tries + "回）\n========================================\n #理不尽面接 #黒狐採用\n" + gameUrl
      : "========================================\n【不採用通知｜株式会社 黒狐（" + st.name + "敗退）】\n理由：「" + lastReason + "」\n（現在の内定者：" + wins + "人）\n========================================\n #理不尽面接 #黒狐採用\n" + gameUrl;
    var shareUrl = "https://twitter.com" + "/intent/tweet?text=" + encodeURIComponent(txt);
    var btnLose = document.getElementById('btn-share');
    var btnWin = document.getElementById('btn-share-win');
    if (btnLose) {
      btnLose.href = shareUrl;
      btnLose.target = "_blank";
    }
    if (btnWin) {
      btnWin.href = shareUrl;
      btnWin.target = "_blank";
    }
  }


  function start() {
    cur = 0;
    tries++;
    localStorage.setItem('kurogitsune_tries', tries); // ← この1行を追加！
    document.getElementById('attempts').textContent = tries + " 回";
    loadQ();
    show('interview-screen');
  }


  function loadQ() {
    var st = window.stages.slice(cur, cur + 1).pop();
    document.getElementById('q-step').textContent = st.step;
    document.getElementById('prob-tag').textContent = "突破率：" + st.label;
    document.getElementById('boss-name').textContent = st.boss;

    var currentSet = getNextQuestion();
    document.getElementById('dialogue').textContent = currentSet.q;

    var box = document.getElementById('choices');
    box.innerHTML = '';

    var shuffled = currentSet.a.slice().sort(function() {
      return Math.random() - 0.5;
    });
    var picked = shuffled.slice(0, 3);

    picked.forEach(function(choiceObj) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice-btn';
      b.textContent = choiceObj.text;
      b.onclick = function() {
        answer(choiceObj.reason);
      };
      box.appendChild(b);
    });
  }

  function answer(reason) {
    var st = window.stages.slice(cur, cur + 1).pop();
    if (Math.random() < st.prob) {
      cur++;
      if (cur >= 3) {
        wins++;
        localStorage.setItem('kurogitsune_wins', wins); // ← この1行を追加！
        document.getElementById('clears').textContent = wins + " 人";
        updateShareLinks(true);
        show('clear-screen');
      } else {
        loadQ();
      }
    } else {
      lastReason = reason;
      document.getElementById('stage-reached').textContent = st.name;
      document.getElementById('reason-text').textContent = reason;
      updateShareLinks(false);
      var app = document.getElementById('app');
      app.classList.remove('shake');
      void app.offsetWidth;
      app.classList.add('shake');
      show('result-screen');
    }
  }

  document.getElementById('btn-start').onclick = start;
  document.getElementById('btn-retry').onclick = start;
  document.getElementById('btn-retry-win').onclick = start;
</script>
</body>
</html>
